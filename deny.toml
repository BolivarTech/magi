# certificados raíz de Mozilla que llega vía `rustls-platform-verifier` →
# `reqwest`. Es una licencia de DATOS (Community Data License Agreement,
# variante permisiva), no de código: permite uso, modificación y redistribución
# sin copyleft y sin obligaciones más allá de conservar el texto de licencia.
