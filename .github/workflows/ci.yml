name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    # Magi is Windows-first and its `system::secrets` tests use the real OS
    # keyring, which works out-of-the-box on the Windows runner (Credential
    # Manager). A headless Linux runner would need a gnome-keyring/dbus session.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      # The pinned toolchain above and Cargo.toml's `rust-version` are one
      # decision recorded in two files, and only one direction of a mismatch
      # fails on its own: a toolchain OLDER than the MSRV makes cargo refuse to
      # build. A toolchain NEWER than it breaks nothing and quietly stops
      # verifying the floor we publish to crates.io, so assert equality here.
      - name: Assert the pinned toolchain matches Cargo.toml's rust-version
        shell: bash
        run: |
          set -euo pipefail
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          RUSTC=$(rustc --version | cut -d' ' -f2)
          if [ "$MSRV" != "$RUSTC" ]; then
            echo "::error::MSRV drift: Cargo.toml says rust-version = '$MSRV' but the pinned toolchain is $RUSTC. Update BOTH the 'rust-version' in Cargo.toml and every 'dtolnay/rust-toolchain@<version>' in .github/workflows/, or the published MSRV stops being the one CI verifies."
            exit 1
          fi
          echo "OK: MSRV $MSRV == pinned toolchain $RUSTC."
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # `--locked` here is what makes a stale Cargo.lock fail on the main push
      # that introduced it, instead of silently regenerating the lock and letting
      # the drift surface days later as a broken release (see the v0.10.3 run,
      # where every `--locked` platform build and `cargo publish` failed).
      - run: cargo nextest run --locked

  clippy:
    name: Clippy
    # On Windows too: clippy --all-targets compiles the keyring-backed test code,
    # which builds reliably here without extra system libraries.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - run: cargo fmt --check
