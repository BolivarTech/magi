name: Release

# The version in `Cargo.toml` is the SINGLE SOURCE OF TRUTH for a release.
#
# Push a version bump to `main` and this workflow validates it, builds every
# platform, publishes to crates.io and only THEN creates the `vX.Y.Z` tag and the
# GitHub Release. Pushes that do not change the version are a no-op: the gate
# reports "already released" and nothing downstream runs.
#
# Why the tag is created LAST, not first. The previous design triggered on a tag
# push, so the tag existed before anything had been compiled — and when the build
# failed, the tag was left pointing at a broken commit (see v0.10.3, which had to
# be deleted and re-pushed, and v0.10.2, which is tagged but never reached
# crates.io). Creating it at the end makes a tag mean exactly one thing: this
# version built, published and released successfully.
on:
  push:
    branches: [main]
  # PRs run the GATE ONLY — never a build, never a release. Without this, a PR
  # that rolls the version backwards or bumps it without a CHANGELOG entry sails
  # through `ci.yml` (which does not look at versions) and only blows up AFTER
  # the merge, leaving main on a bad version with a red workflow to clean up.
  # Validating here moves that feedback to review time, where it belongs.
  pull_request:
    branches: [main]
  # Manual dry-run: exercises CI and every platform build/package WITHOUT
  # tagging, publishing or releasing. Use it to validate all targets before
  # committing a version bump.
  workflow_dispatch:

# Serialise release runs. Two merges landing seconds apart would otherwise race
# to tag and publish; `cancel-in-progress: false` lets the first finish rather
# than killing a run that may already have published to crates.io.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Release gate ──────────────────────────────────────────────────────────
  # Everything hangs off this job, so a bad bump costs ~15 s instead of five
  # platform builds. It answers one question: "should this push cut a release,
  # and is it safe to?"
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      # "this ref declares a version never released before" — true on a PR that
      # bumps, so PR-time checks can key off it.
      is_new_version: ${{ steps.gate.outputs.is_new_version }}
      # "…and we are actually allowed to release it" — push to main only.
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      # `fetch-depth: 0` because the rollback check needs the FULL tag list;
      # the default shallow clone fetches no tags at all and would silently
      # conclude that nothing has ever been released.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: gate
        name: Resolve version, block rollbacks, decide whether to release
        run: |
          set -euo pipefail

          # First `^version = ` in Cargo.toml is the [package] one: dependency
          # versions are either indented or inline in a table, never at column 0.
          V="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          if [ -z "$V" ]; then
            echo "::error::could not extract the package version from Cargo.toml"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"    >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $V"

          # Reject anything that is not a plain X.Y.Z before it becomes a tag.
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$V' is not a plain X.Y.Z — refusing to derive a tag from it."
            exit 1
          fi

          NEWVER=true

          # ROLLBACK PROTECTION. Compare against the highest X.Y.Z ever tagged.
          # `sort -V` orders versions numerically (2.10 > 2.9), which a plain
          # lexical sort gets wrong.
          #
          # The comparison is against MAX and NOT against "does tag vX.Y.Z
          # exist", deliberately. Asking only whether the tag exists has a hole:
          # rolling Cargo.toml back to an OLD but already-released version
          # (0.10.3 -> 0.10.0) finds the tag present and looks like a harmless
          # no-op, so main would silently sit on a stale version with nobody
          # told. Ordering against MAX catches it as the rollback it is.
          MAX="$(git tag -l 'v*' | sed 's/^v//' \
                 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          echo "highest version released so far: ${MAX:-<none>}"

          if [ -z "$MAX" ]; then
            echo "No release tags yet — $V will be the first."
          elif [ "$V" = "$MAX" ]; then
            # The overwhelmingly common case: most pushes to main do not touch
            # the version. A NO-OP, never a failure.
            echo "Version $V is already released as v$MAX — this ref does not bump it. Nothing to release."
            NEWVER=false
          elif [ "$(printf '%s\n%s\n' "$V" "$MAX" | sort -V | head -1)" = "$V" ]; then
            # Fails on a PR too, which is the whole point of running this job on
            # pull_request: the rollback is caught at review time, not after merge.
            echo "::error::ROLLBACK BLOCKED — Cargo.toml declares $V but v$MAX is already released. A release version must move forward; bump past $MAX or restore the correct version."
            exit 1
          else
            echo "New version $V > $MAX."
          fi

          # Belt and braces: MAX only sees well-formed X.Y.Z tags, so an oddly
          # shaped pre-existing tag could still collide. Never overwrite one.
          if [ "$NEWVER" = "true" ] && git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::tag v$V already exists but is not the highest release — refusing to overwrite it."
            exit 1
          fi

          echo "is_new_version=$NEWVER" >> "$GITHUB_OUTPUT"

          # Releasing requires BOTH a new version and a push to main. A PR or a
          # manual dispatch validates but never tags, publishes or releases.
          SHOULD="$NEWVER"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Event is '${{ github.event_name }}', not a push to main — validation only, nothing will be tagged, published or released."
            SHOULD=false
          fi
          echo "should_release=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "--> is_new_version=$NEWVER  should_release=$SHOULD"

      # A stale `Cargo.lock` is what actually broke the v0.10.3 release: commits
      # bumped `Cargo.toml` alone, so every `--locked` build died with "cannot
      # update the lock file" and `cargo publish` aborted on a dirty tree.
      # `cargo metadata --locked` re-resolves against the committed lock WITHOUT
      # compiling, so this costs seconds.
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Assert Cargo.lock is in sync with Cargo.toml
        run: |
          set -euo pipefail
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::error::Cargo.lock is out of sync with Cargo.toml. Run 'cargo update -p magi-rs' (or 'cargo check') locally and commit the regenerated Cargo.lock. A version bump MUST be committed together with its Cargo.lock."
            exit 1
          fi
          echo "OK: Cargo.lock resolves cleanly under --locked."

      # Keyed on `is_new_version`, NOT `should_release`, so a PR that bumps the
      # version is told about the missing entry at review time. An ordinary push
      # or PR that does not touch the version is never blocked for lacking a
      # CHANGELOG entry it does not need.
      - name: Assert CHANGELOG has an entry for this version
        if: steps.gate.outputs.is_new_version == 'true'
        run: |
          set -euo pipefail
          V="${{ steps.gate.outputs.version }}"
          if ! grep -q "^## \[$V\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$V]' section. Add one (Keep a Changelog format, e.g. '## [$V] - YYYY-MM-DD') before releasing — the release notes are extracted from it, so without it the release ships with no notes."
            exit 1
          fi
          echo "OK: CHANGELOG.md documents $V."

  ci:
    name: CI
    # Gated on the release gate so a rollback or a stale lock blocks EVERYTHING
    # downstream (build / build-macos / publish / release all reach back here).
    needs: gate
    # Only for an actual release or a dry-run. `ci.yml` already runs this exact
    # suite on every push to main and on every PR; without this condition each
    # ordinary push would run the full Windows test suite TWICE. A no-op push
    # therefore costs just the ~15 s gate. Note that skipping this job also skips
    # everything that needs it, which is precisely the desired behaviour.
    if: needs.gate.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    # Windows runner so the vault-era tests pass (see ci.yml for rationale).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # **`nextest`, never `cargo test` — this is a requirement, not a preference.**
      # The logging subsystem installs itself into a `OnceLock` and raises the
      # process-global `LevelFilter`. `cargo test` runs the whole library in ONE
      # process, so that state leaks between tests and five of them fail for a
      # reason unrelated to the code under test. `the_suite_requires_a_process_per_
      # test_runner` (src/logging/mod.rs) fails loudly if this line is ever changed.
      - run: cargo nextest run --locked

  # Native per-platform builds for Windows, Linux x64 and Raspberry Pi 5 (aarch64).
  build:
    name: Build ${{ matrix.name }}
    needs: [gate, ci]
    # Builds run for a real release AND for a manual dry-run — the whole point of
    # the dry-run is to exercise them.
    if: needs.gate.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      # Surface every platform failure in one run; a single failed leg still
      # fails the job overall, so `release` (needs: build) is blocked and no
      # partial release is published (abort-all policy).
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # TWO x86_64 Linux artifacts, deliberately. They differ ONLY in which
          # glibc symbol versions they request; same source, same flags.
          #
          #   linux-x86_64         — linked natively against the runner's glibc
          #                          2.35. The default for a current desktop or
          #                          server, and the build path that has been
          #                          shipping since v0.10.0 (no zig in the chain).
          #   linux-x86_64-compat  — linked against a 2.17 baseline via
          #                          `cargo-zigbuild`. glibc is forward-compatible,
          #                          so this one runs EVERYWHERE the other does
          #                          plus every enterprise distro the 2.35 build
          #                          cannot: RHEL/Rocky/Alma/CloudLinux 8 (2.28)
          #                          and RHEL 9 (2.34) both reject a 2.35 binary
          #                          with "GLIBC_2.34 not found".
          #
          # On the perf question that motivates keeping the native one: glibc
          # dispatches the hot string/memory routines through IFUNC at load time,
          # so the -compat binary still gets the CPU-optimised `memcpy` on a
          # modern host. The measurable delta is confined to a few libm routines
          # rewritten in 2.28+. The native build is kept mainly as the proven,
          # toolchain-free path — not because -compat is meaningfully slower.
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-compat
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            glibc: '2.17'
          - name: linux-aarch64-rpi5
            # aarch64 built on glibc 2.35 <= Raspberry Pi OS Bookworm's 2.36,
            # so the binary runs on a Pi 5 without a "GLIBC version" error.
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps (p7zip)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full

      # Only the legs that declare `matrix.glibc` need zig; the others build
      # natively. `taiki-e/install-action` fetches a prebuilt cargo-zigbuild
      # instead of compiling it from source (~4 min saved per run).
      - name: Install zig (old-glibc baseline)
        if: matrix.glibc != ''
        run: pip3 install ziglang
      - uses: taiki-e/install-action@v2
        if: matrix.glibc != ''
        with:
          tool: cargo-zigbuild
      - name: Build release binary (old-glibc baseline)
        if: matrix.glibc != ''
        run: cargo zigbuild --release --locked --bin magi-rs --target ${{ matrix.target }}.${{ matrix.glibc }}
      - name: Build release binary
        if: matrix.glibc == ''
        run: cargo build --release --locked --bin magi-rs --target ${{ matrix.target }}

      # Proof, not assumption: print the highest glibc symbol version the binary
      # actually requires. A leg with a baseline MUST NOT exceed it — otherwise
      # the artifact silently goes back to being unusable on old distros, which
      # is exactly the regression this whole split exists to prevent.
      - name: Verify glibc baseline
        if: matrix.glibc != ''
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/magi-rs"
          echo "----- versioned glibc symbols required -----"
          objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV || true
          MAXV="$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)"
          echo "highest required: GLIBC_$MAXV (baseline target: ${{ matrix.glibc }})"
          if [ "$(printf '%s\n%s\n' "$MAXV" "${{ matrix.glibc }}" | sort -V | tail -1)" != "${{ matrix.glibc }}" ]; then
            echo "::error::binary requires GLIBC_$MAXV, above the ${{ matrix.glibc }} baseline — it will NOT run on old distros."
            exit 1
          fi
          echo "OK: within the ${{ matrix.glibc }} baseline."

      # Archive names come from the gate's version, not from `github.ref_name`:
      # this workflow now runs on a BRANCH, so `ref_name` would be `main`.
      # `.tar.gz` ALONGSIDE `.7z`, not instead of it. `.7z` compresses better, but
      # `p7zip` is not installed by default on RHEL-family distros, minimal server
      # images or most containers — so the smaller archive is the one a scripted
      # install is least likely to be able to open. `tar`/`gzip` are present on
      # every Unix that can run the binary at all, and Python's stdlib `tarfile`
      # reads it with no third-party dependency.
      - name: Package (Unix — .tar.gz + .7z)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="magi-rs-${{ needs.gate.outputs.tag }}-${{ matrix.name }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/magi-rs" "$STAGE/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          7z a -mx=9 "$STAGE.7z" "$STAGE"
          echo "Packaged $STAGE.tar.gz and $STAGE.7z"

      - name: Package (Windows — .7z + .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "magi-rs-${{ needs.gate.outputs.tag }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/magi-rs.exe" $stage
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage
          # .7z (as requested) plus a native-double-click .zip for Windows users
          # who do not have 7-Zip installed.
          7z a -mx=9 "$stage.7z" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"
          Write-Host "Packaged $stage.7z and $stage.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.name }}
          path: |
            magi-rs-*.tar.gz
            magi-rs-*.7z
            magi-rs-*.zip
          if-no-files-found: error

  # macOS as a single universal2 (Intel + Apple Silicon) binary via `lipo`:
  # one download that runs natively on any modern Mac.
  build-macos:
    name: Build macos-universal2
    needs: [gate, ci]
    if: needs.gate.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked --bin magi-rs --target x86_64-apple-darwin
          cargo build --release --locked --bin magi-rs --target aarch64-apple-darwin
      - name: Create universal binary and package (.tar.gz + .7z)
        run: |
          set -euo pipefail
          brew install sevenzip
          STAGE="magi-rs-${{ needs.gate.outputs.tag }}-macos-universal2"
          mkdir "$STAGE"
          lipo -create -output "$STAGE/magi-rs" \
            target/x86_64-apple-darwin/release/magi-rs \
            target/aarch64-apple-darwin/release/magi-rs
          lipo -info "$STAGE/magi-rs"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          # `COPYFILE_DISABLE=1` because macOS `tar` is bsdtar: without it, any
          # file carrying extended attributes gets a companion AppleDouble entry
          # (`._magi-rs`) inside the tarball. Harmless on macOS, but it litters
          # the extracted directory on Linux and would show up in the checksum
          # manifest as unexplained files.
          COPYFILE_DISABLE=1 tar -czf "$STAGE.tar.gz" "$STAGE"
          7zz a -mx=9 "$STAGE.7z" "$STAGE"
          echo "Packaged $STAGE.tar.gz and $STAGE.7z"
      - uses: actions/upload-artifact@v5
        with:
          name: dist-macos-universal2
          path: |
            magi-rs-*.tar.gz
            magi-rs-*.7z
          if-no-files-found: error

  # crates.io comes BEFORE the tag: a publish is irreversible (yank only), so it
  # is the last thing that can genuinely fail. If it does, no tag is created and
  # the bump can simply be re-pushed.
  publish:
    name: Publish to crates.io
    needs: [gate, ci, build, build-macos]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Publish (skip if this version is already on crates.io)
        run: |
          set -euo pipefail
          V="${{ needs.gate.outputs.version }}"
          # Idempotency: if a previous run published but then failed before
          # tagging, re-running must not die on "crate version already uploaded".
          if curl -sf -H 'User-Agent: magi-rs-release-ci' \
               "https://crates.io/api/v1/crates/magi-rs/$V" > /dev/null; then
            echo "magi-rs $V is already on crates.io — skipping publish."
          else
            cargo publish --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Creates the tag AND the GitHub Release, together, as the very last action.
  # Reaching this job means: CI green, all five archives built, crate published.
  release:
    name: Tag and GitHub Release
    needs: [gate, publish, build, build-macos]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: List collected artifacts
        run: ls -lR dist
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          # `.txt` rather than the bare GNU convention `SHA256SUMS`: Magi is
          # Windows-first, and an extensionless file shows up in Explorer as an
          # unopenable "File". `sha256sum -c` does not care about the name.
          #
          # Redirect OUTSIDE the globbed directory, then move it in: writing
          # straight to ./SHA256SUMS.txt would let the shell create the file
          # before the glob expands and hash the (empty) checksum file into itself.
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt
          # Self-check: verify what we just wrote actually validates, so a broken
          # checksum file fails the release instead of shipping unverifiable.
          sha256sum -c --strict SHA256SUMS.txt
      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${{ needs.gate.outputs.version }}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { flag = 0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          # The gate already proved the section exists, so an empty file here
          # means the section is present but blank — worth saying out loud.
          if [ ! -s release-notes.md ]; then
            echo "::warning::the CHANGELOG section for $VERSION is empty; falling back to auto-generated notes."
          fi
          echo "----- release notes -----"
          cat release-notes.md
      # `tag_name` on a branch ref makes this action create the tag at the
      # current SHA and cut the release in one step — so the tag comes into
      # existence only here, after everything above has succeeded.
      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
