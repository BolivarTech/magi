name: Release

on:
  push:
    tags: ['v*']
  # Manual dry-run: exercises CI + every platform build/package WITHOUT
  # publishing to crates.io or cutting a GitHub Release (those jobs are gated
  # to tag pushes below). Use this to validate all targets before tagging.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail-closed guard against the version drift that `--version` would otherwise
  # report as truth: the tag, `Cargo.toml` and the binaries must agree. Runs FIRST
  # and everything else hangs off it (via `ci`), so a mismatch costs ~10 s instead
  # of five platform builds.
  #
  # Deliberately NOT gated with a job-level `if:` — a skipped job skips its
  # dependents in GitHub Actions, which would silently disable the whole manual
  # dry-run. The job always runs; the comparison is what's conditional.
  version-guard:
    name: Version guard (tag == Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Assert the tag matches the crate version
        run: |
          set -euo pipefail
          # First `^version = ` in Cargo.toml is the [package] one: dependency
          # versions are either indented or inline in a table, never at column 0.
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::could not extract the package version from Cargo.toml"
            exit 1
          fi
          echo "Cargo.toml version: $CARGO_VERSION"

          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG_VERSION="${GITHUB_REF#refs/tags/v}"
              echo "Git tag version:    $TAG_VERSION"
              if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
                # NOTE: no backticks in this message — inside a double-quoted
                # string bash would run them as command substitution, which is
                # exactly what mangled this error on the v0.10.3 run.
                echo "::error::version mismatch — tag says '$TAG_VERSION' but Cargo.toml says '$CARGO_VERSION'. Bump Cargo.toml (and Cargo.lock) or retag; the released binaries would report '$CARGO_VERSION' from --version while the release is labelled 'v$TAG_VERSION'."
                exit 1
              fi
              echo "OK: tag and crate version agree ($CARGO_VERSION)."
              ;;
            *)
              echo "Not a tag push ($GITHUB_REF) — dry run, nothing to compare against."
              ;;
          esac

      # The tag/Cargo.toml guard above does NOT catch a stale `Cargo.lock`, which
      # is what actually broke the v0.10.3 release: two commits bumped only
      # `Cargo.toml`, leaving the committed lock recording the previous version.
      # Every `--locked` build then died with "cannot update the lock file", and
      # `cargo publish` regenerated the lock and aborted on a dirty tree.
      #
      # `cargo metadata --locked` re-resolves against the committed lock WITHOUT
      # compiling, so this costs seconds and fails here instead of five platform
      # builds later.
      - uses: dtolnay/rust-toolchain@stable
      - name: Assert Cargo.lock is in sync with Cargo.toml
        run: |
          set -euo pipefail
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            echo "::error::Cargo.lock is out of sync with Cargo.toml. Run 'cargo update -p magi-rs' (or 'cargo check') locally and commit the regenerated Cargo.lock. A version bump in Cargo.toml MUST be committed together with its Cargo.lock."
            exit 1
          fi
          echo "OK: Cargo.lock resolves cleanly under --locked."

  ci:
    name: CI
    # Gated on the version guard so a mismatch blocks EVERY downstream job
    # (publish/build/build-macos/release all reach back to `ci`).
    needs: version-guard
    # Windows runner so the vault/keyring-era tests pass (see ci.yml for rationale).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run

  publish:
    name: Publish to crates.io
    needs: ci
    # Tag pushes only — never on a manual dry-run dispatch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo.toml version
        run: |
          CARGO_VERSION="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Native per-platform builds for Windows, Linux x64 and Raspberry Pi 5 (aarch64).
  # Building natively on each runner avoids the openssl-sys / SQLite cross-compile
  # pain: TLS uses each OS's native stack (SChannel / OpenSSL / Secure Transport)
  # and the runner already ships the toolchain and system libraries it needs.
  build:
    name: Build ${{ matrix.name }}
    needs: ci
    strategy:
      # Surface every platform failure in one run; a single failed leg still
      # fails the job overall, so the `release` job (needs: build) is blocked
      # and no partial release is published (abort-all policy).
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            # Ubuntu 22.04 (glibc 2.35) for the widest runtime compatibility.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64-rpi5
            # aarch64 built on glibc 2.35 <= Raspberry Pi OS Bookworm's 2.36,
            # so the binary runs on a Pi 5 without a "GLIBC version" error.
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps (OpenSSL, X11/xcb for arboard, p7zip)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            p7zip-full
      - name: Build release binary
        run: cargo build --release --locked --bin magi-rs --target ${{ matrix.target }}

      - name: Package (Unix — .7z)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STAGE="magi-rs-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/magi-rs" "$STAGE/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          7z a -mx=9 "$STAGE.7z" "$STAGE"
          echo "Packaged $STAGE.7z"

      - name: Package (Windows — .7z + .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "magi-rs-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/magi-rs.exe" $stage
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage
          # .7z (as requested) plus a native-double-click .zip for Windows users
          # who do not have 7-Zip installed.
          7z a -mx=9 "$stage.7z" $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"
          Write-Host "Packaged $stage.7z and $stage.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.name }}
          path: |
            magi-rs-*.7z
            magi-rs-*.zip
          if-no-files-found: error

  # macOS as a single universal2 (Intel + Apple Silicon) binary via `lipo`:
  # one download that runs natively on any modern Mac. macOS TLS uses Secure
  # Transport, so there is no OpenSSL dependency to satisfy.
  build-macos:
    name: Build macos-universal2
    needs: ci
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked --bin magi-rs --target x86_64-apple-darwin
          cargo build --release --locked --bin magi-rs --target aarch64-apple-darwin
      - name: Create universal binary and package (.7z)
        run: |
          brew install sevenzip
          STAGE="magi-rs-${{ github.ref_name }}-macos-universal2"
          mkdir "$STAGE"
          lipo -create -output "$STAGE/magi-rs" \
            target/x86_64-apple-darwin/release/magi-rs \
            target/aarch64-apple-darwin/release/magi-rs
          lipo -info "$STAGE/magi-rs"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          7zz a -mx=9 "$STAGE.7z" "$STAGE"
          echo "Packaged $STAGE.7z"
      - uses: actions/upload-artifact@v5
        with:
          name: dist-macos-universal2
          path: magi-rs-*.7z
          if-no-files-found: error

  release:
    name: GitHub Release
    # Requires crates.io publish AND every platform build to succeed: if any
    # target fails to compile, this job never runs and no release is cut.
    needs: [publish, build, build-macos]
    # Tag pushes only — never on a manual dry-run dispatch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: List collected artifacts
        run: ls -lR dist
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          # `.txt` rather than the bare GNU convention `SHA256SUMS`: Magi is
          # Windows-first, and an extensionless file shows up in Explorer as an
          # unopenable "File". `sha256sum -c` does not care about the name.
          #
          # Redirect OUTSIDE the globbed directory, then move it in: writing
          # straight to ./SHA256SUMS.txt would let the shell create the file
          # before the glob expands and hash the (empty) checksum file into itself.
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt
          # Self-check: verify what we just wrote actually validates, so a broken
          # checksum file fails the release instead of shipping unverifiable.
          sha256sum -c --strict SHA256SUMS.txt
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { flag = 0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION; falling back to auto-generated notes."
          fi
          echo "----- release notes -----"
          cat release-notes.md
      - name: Create GitHub Release (all platform archives)
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
