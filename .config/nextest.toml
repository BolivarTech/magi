# nextest configuration.
#
# ## Why this file exists
#
# The vault derives its KEK with Argon2id at OWASP 2025 cost (m=65536 KiB / 64 MiB,
# t=3, **p=4**). That `p=4` is what matters: EVERY test that opens a vault or an
# encrypted DB occupies **four lanes**, not one. This box has 6 physical cores (12
# logical), so two heavy tests running in parallel already saturate all 6.
#
# Without a cap, nextest launches up to 12 at once => 48 lanes over 6 cores. Tests
# sensitive to wall-clock time (task aborts, tokio timeouts, SQLite's 5 s
# busy_timeout) starve for CPU within their budget and fail intermittently: a
# flaky gate, not a real regression — everything passes 100% in isolation.
#
# ## Why the filter is BY SUBSYSTEM, not a list of leaf modules
#
# The previous version filtered `test(/utils::crypto::tests::/)`, and that module
# **was deleted in v0.8.0** (Vault MS1) when crypto moved to the `cryptovault`
# crate. A nextest filter that matches nothing raises **no error**, so the cap
# stayed declared in this file and silently stopped applying. The Argon2 load had
# migrated to `vault::envelope`, `vault::master`, `vault::store` and
# `agent::tests`, none of which were named.
#
# The exact failure mode this cap exists to prevent reappeared in MS2:
# `headless_runner::tests::test_run_consult_future_drop_aborts_spawned_analysis`
# failed under load while two `vault::envelope::tests::test_rekey_*` ran 77 s each
# with no throttling.
#
# That is why the filter names **whole subsystems** instead of leaf modules:
# renaming or splitting a submodule under `vault::` no longer drops it out of the
# group. It sweeps in cheap tests too (`vault::cli::tests` runs in 35 ms), and
# that cost is deliberate: a cap that falls off by itself the moment someone
# refactors is worse than one that is slightly too wide.
#
# ## The same trap, one level down (MS2 Loop 1 fix)
#
# `test(/memory::store::/)` covered the shared connection/DEK of the vector
# store, but five more test modules open their OWN `EncryptedSqliteMemory`
# directly and pay the identical four-lane Argon2 cost: `memory::context`,
# `memory::decay`, `memory::profile`, `memory::retrieval`, `memory::bench`, and
# `tools::knowledge`. None of them matched `memory::store::` — the exact
# "matches nothing, raises no error, cap silently narrows" trap described above,
# just one module deeper. Fixed by widening `memory::store::` to `memory::`
# (the whole subsystem, not one of its modules) and adding `tools::knowledge::`
# as its own subsystem, since it lives outside `memory::` but opens the same
# encrypted DB to persist project facts.
#
# The subsystems covered, with their reason:
#   - `vault::`            — derives the KEK (envelope, master, store, diagnose)
#   - `system::database::` — bootstraps the envelope when opening the DB
#   - `agent::tests::`     — open a real encrypted DB (persistence, memory)
#   - `memory::`           — every module that opens its own
#                            `EncryptedSqliteMemory`, or shares the vector
#                            store's connection/DEK
#   - `tools::knowledge::` — persists project facts through the same encrypted DB
#
# ## The cost, measured — not estimated
#
# Widening the group **slows down** the suite: 275 s -> 419 s (+52%) on this box,
# measured for the four-subsystem filter above. The prediction when this was
# written was the opposite — that removing the oversubscription would pay for
# itself — and it was wrong: serializing the heavy group costs more than it saves
# in contention. It is paid anyway, because a gate that fails once every so many
# runs forces a re-run and casts doubt on the evidence, and that costs more than
# two and a half minutes. The further widening to `memory::` and
# `tools::knowledge::` above was not re-benchmarked in isolation — the five added
# modules are small (one `EncryptedSqliteMemory::new` call each, three in
# `tools::knowledge`) — but the same trade-off applies: correctness of the cap
# over its own stated coverage claim is not optional.
#
# If the cost starts to hurt, the lever is `max-threads = 3` (12 lanes over 12
# logical processors, no oversubscription), NOT trimming the filter: trimming it
# reintroduces exactly the rot the section above documents.
#
# If residual flake appears, drop `max-threads` to 1 before touching the filter.
#
# ## The lever was pulled (2026-08-07, MS2 Loop 1)
#
# The cost did start to hurt. Widening the filter took the suite to 492 s on this
# box, and a fix round paying that per commit spent ~88% of its wall-clock inside
# `cargo`: two rounds of 13 and 11 commits took 3h26m and 2h58m respectively.
#
# So `max-threads` went 2 -> 3, which is exactly the lever this file already
# named and for the reason it gave: **3 heavy tests x 4 Argon2 lanes = 12 lanes
# over 12 logical processors**. That is the ceiling, not a compromise — going to
# 4 would put 16 lanes on 12 processors and reintroduce the oversubscription the
# whole cap exists to prevent, which is the failure this file documents twice.
#
# The filter was NOT touched, deliberately: trimming it is what rotted twice
# before, and the coverage claim in the section above has to stay true.
#
# If flake returns, go back to 2 before considering anything else. A slower gate
# is cheaper than one whose evidence cannot be trusted.
#
# ## The same trap, TWO levels down (MS2 gate, third pass)
#
# `test(/system::database::/)`, `test(/agent::tests::/)`, and `test(/tools::knowledge::/)`
# were still leaf-module patterns, in direct contradiction of the policy this file spends
# its first section explaining — caught independently by two reviewers in the same gate
# round (S10, Caspar and Balthasar). `agent::tests::` in particular already had siblings
# it did not cover: `agent::provider::tests` and `agent::mode_classifier::tests` are
# separate leaf test modules one level under `agent::`, exactly the shape that rotted
# `memory::store::` before it. Widened to subsystem level: `system::database::` ->
# `system::` (sweeps in `fs`, `git`, `grep`, `path_guard`, `workspace` — none of them open
# an encrypted DB, but a leaf pattern here is what silently dropped coverage twice
# already), `agent::tests::` -> `agent::` (adds `agent::provider::tests`,
# `agent::mode_classifier::tests`), `tools::knowledge::` -> `tools::` (adds `bash`,
# `consult`, `grep`, `ls`, `read`, `write`, and `tools::mod`'s own tests). Matched test
# count went from 242 to 416 (`cargo nextest list -E '<filter>'`, counted before and after
# this change) — the filter was NOT trimmed back down to the smaller number: per this
# file's own rule, a cap that is a little too wide is the cost of one that cannot rot.
#
# ## The first VICTIM joins the group (2026-08-10, v0.12.2 release)
#
# Every entry above earns its place by PRODUCING Argon2 load. `headless_runner::` earns
# its place by SUFFERING it, and that is a deliberate widening of the membership rule to
# match what the first section of this file already says the cap is for: "tests sensitive
# to wall-clock time ... starve for CPU within their budget and fail intermittently".
# Protecting a victim is the stated purpose; producing load was only ever the proxy.
#
# What forced it: `headless_runner::tests::test_run_query_timeout_kills_bash_and_reports_
# timeout_windows` failed in CI on the v0.12.2 release run, on the PRECONDITION
# `the child really ran (START present)` — not on the property under test. It ran 18.7 s
# alongside two `vault::envelope::tests::test_rekey_*` of 18.5 s and 18.75 s. Unthrottled,
# it was competing with up to 3 heavy tests x 4 Argon2 lanes.
#
# This is the THIRD time this module has been hit. The second is recorded above
# (`test_run_consult_future_drop_aborts_spawned_analysis`). The first is recorded in the
# rustdoc of `CANCEL_FIRE_DELAY_MS`, whose remedy was to grow the constant from ~2 s to
# 5 s — a duration sized against one machine's contention. CI's runner exceeded 5 s of
# `python` cold start, so the kill fired before the worker had written START.
#
# Matched test count went from 489 to 538 (`cargo nextest list -E '<filter>'`, counted
# before and after), a delta of exactly the 49 tests in `headless_runner::`. Counting was
# verified against the OLD filter as a control first: the initial attempt reported 0 for
# every filter including the known-good one, which exposed a broken counting command
# rather than a broken pattern. That control is the only reason this entry is not the
# "matches nothing, raises no error" failure the top of this file exists to warn about.
#
# **This entry does not fix the ordering, and must not be mistaken for a fix.** It removes
# the contention that makes a cold start exceed the budget; the budget is still a guessed
# duration. The real remedy is to derive the delay from a MEASURED cold start instead of a
# constant, which is tracked as follow-up. Until that lands, a heavier CI runner can
# reproduce this.
#
# ## The FOURTH hit, and why the measured remedy was not enough (v0.14.1)
#
# The remedy above landed -- the delay is derived from a measured cold start -- and the test
# still failed twice in a row on the v0.14.0 release run. The measurement was the problem: it
# timed `python probe.py` DIRECTLY, while the worker runs through the `bash` tool, which wraps
# every command in `powershell -NoProfile -Command` on Windows. Measured side by side on the
# dev box: **84 ms direct against ~900 ms wrapped**, more than 10x. The probe was not
# imprecise, it was measuring a different thing than the number it predicted; the 5 s floor
# hid that on a fast machine, and on the runner the cheap probe reported 1282 ms while the
# wrapped path went past the floor.
#
# The probe now launches through the same wrapper, and a test asserts the RELATION rather than
# a threshold, so it stays honest on any machine.
#
# The lesson generalises past this test: a measurement used to predict a cost has to traverse
# the same path as the thing it predicts. Two of the four hits here were spent on remedies
# that made the budget bigger instead of asking what the budget was measuring.

# ## An INTEGRATION binary joins, and it needed a different kind of pattern (v0.13.1)
#
# `tests/workdir_flag.rs` spawns the real `magi-rs` binary to prove `-w` reaches the
# filesystem. Several of its tests seed a workspace and then read it back, so each pays a
# full Argon2id KDF **in a child process** — measured at ~17 s apiece. It produces the load
# this group exists to throttle, so it belongs here by the rule the sections above establish.
#
# The count is stated as "several" on purpose. An earlier draft of this comment said "two of
# its five", and by the time the branch was reviewed the file had ten tests and four of them
# paid the KDF — a MAGI reviewer caught the drift. A number pinned in prose next to a filter
# that matches the WHOLE binary is a maintenance liability with no reader benefit: the filter
# does not depend on it, and nothing fails when it rots.
#
# Every pattern above is `test(/…::/)`, and **not one of them can match it**: an integration
# test's name has no `::` path — it is the bare function name, `init_scaffolds_…`. Reaching it
# by name would mean `test(/init_scaffolds/)`, which is a leaf pattern of the exact kind this
# file has now watched rot three times. `binary(workdir_flag) | binary(auditor_isolation) | binary(init_logging) | binary(prompt_never_logged) | binary(canary_both_mouths)` is the subsystem-level
# equivalent for an integration target: renaming or adding a test inside the file cannot drop
# it out of the group, and only deleting the file itself changes what it matches.
#
# **The four logging binaries are NOT in this group, and that is deliberate.** The cap is
# Argon2 lane arithmetic -- `3 heavy x 4 lanes = 12` over 12 logical processors -- and
# `auditor_isolation`, `init_logging`, `canary_both_mouths` and `prompt_never_logged` open no
# vault and derive no key. They are slow because they SLEEP (one waits twenty seconds on a
# latch), so membership would hold a scarce slot for a load it does not create, while giving
# them nothing back: the group caps its own members against each other, it does not shield
# them from the Argon2 tests outside it. `workdir_flag` stays, because `magi init` opens a
# vault. Filter matches 579 tests, counted with `cargo nextest list -E '<filter>' | grep -c
# '::'` -- NOT `grep -c '^magi-rs '`, which reports 0 here because the bin target prints
# `magi-rs::bin/magi-rs <test>`. That miscount happened while writing this line.
#
# Matched test count went 555 -> 565 (`cargo nextest list -E '<filter>' | grep -c '^magi-rs'`),
# a delta of exactly the tests in that file (10 on Windows; the `#[cfg(unix)]` symlink case
# makes it 11 on Linux). The control the section above demands was run
# first and mattered twice: the initial command counted `'    '` and reported **0** for the
# known-good filter, and the corrected `'^magi-rs '` still reported 73, because integration
# binaries print `magi-rs::<binary> <test>` while the bin target prints `magi-rs <test>` — a
# trailing space silently excluded every binary except one. Only the third form is right. The
# 555 also reconciles with the 538 recorded above: MS3 added tests to subsystems already in
# the group.

[test-groups]
heavy = { max-threads = 3 }

[[profile.default.overrides]]
filter = 'test(/vault::/) | test(/system::/) | test(/agent::/) | test(/memory::/) | test(/tools::/) | test(/headless_runner::/) | binary(workdir_flag)'
test-group = "heavy"
