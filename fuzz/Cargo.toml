[package]
name = "magi-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
magi-rs = { path = ".." }
cryptovault = "0.3.0"

# Fuzz targets. Run on Linux CI with a nightly toolchain:
#   cargo +nightly fuzz run fuzz_vault_meta_decode -- -max_total_time=300
# cargo-fuzz/libFuzzer does not build on Windows MSVC, so these are Linux-only.
[[bin]]
name = "fuzz_vault_meta_decode"
path = "fuzz_targets/fuzz_vault_meta_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_vault_blob_decrypt"
path = "fuzz_targets/fuzz_vault_blob_decrypt.rs"
test = false
doc = false
bench = false

# `fuzz/` es su propio workspace: se excluye del proyecto padre para que
# `cargo build`/`nextest` de magi-rs no intenten compilar libFuzzer.
[workspace]

[[bin]]
name = "fuzz_secret_value_roundtrip"
path = "fuzz_targets/fuzz_secret_value_roundtrip.rs"
test = false
doc = false

[[bin]]
name = "fuzz_passphrase_input"
path = "fuzz_targets/fuzz_passphrase_input.rs"
test = false
doc = false

# Targets de headless (REQ-H35). Parser de entrada no confiable + sanitizador
# de errores; entrada arbitraria ⇒ nunca panic/UB, siempre Result tipado.
[[bin]]
name = "fuzz_headless_input"
path = "fuzz_targets/fuzz_headless_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_sanitize_error"
path = "fuzz_targets/fuzz_sanitize_error.rs"
test = false
doc = false
bench = false

# Target de la matriz de política de tiers (REQ-H35 / MS2 Task 10). Bytes
# arbitrarios ⇒ (tier, nombre de tool); invariante: nunca panic + fail-closed.
[[bin]]
name = "fuzz_policy"
path = "fuzz_targets/fuzz_policy.rs"
test = false
doc = false
bench = false
