[package]
name = "magi-rs"
version = "0.13.0"
edition = "2021"
default-run = "magi-rs"
authors = ["Julian Bolivar <jbolivarg@gmail.com>"]
description = "Magi Agent: a terminal AI assistant in Rust with sandboxed tool execution, OAuth login, and encrypted local memory (authenticated encryption with error-correcting FEC via the cryptovault crate)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/BolivarTech/magi"
readme = "README.md"
keywords = ["terminal", "ai", "assistant", "tui", "llm"]
categories = ["command-line-utilities"]
exclude = ["docs/AUDIT_*.md", "key.txt*", ".claude/", ".remember/", "target/"]

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# TUI
ratatui = "0.26"
crossterm = { version = "0.27", features = ["events"] }
unicode-width = "0.1"

# Networking
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2", "charset"] }
futures = "0.3"
arboard = "3.3"
axum = "0.7"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2.1"
cryptovault = "0.3.0"  # fundación criptográfica auditada (R-V01); reemplaza src/utils/crypto.rs (MS1)
zeroize = "1.8"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4"] }

# MAGI ecosystem
# EXPLICIT features: providers sit behind feature gates and the default brings none, so
# without this the MS2 native trio (REQ-A01b) does not compile. Originally caught by
# `cargo check --example ms2_contracts`; that file pinned nothing (loop 1 fix round A, F2)
# and was deleted, so this is now enforced by the crate's own build + `cargo nextest run`.
#   ollama        -> pulls in openai-compat; used ONLY as a PROBE (D-A07)
#   openai-compat -> completions transport for BOTH `ollama` AND `openai-compat`
#   claude-api    -> ClaudeProvider for kind = anthropic
# claude-cli is NOT enabled: it launches the `claude` binary as a subprocess, bypassing the
# `bash` tool's security model, and rejects with NestedSession under CLAUDECODE (spec §8).
#
# EXACT version (`=`), not caret, and the reason has MOVED — it has not gone away. The pin
# guards the retry defaults, which are exactly the numbers REQ-A04 derives its timeout scale
# from: a `cargo update` that moved them would move the floor of a relation the design makes
# impossible to break from configuration.
#
# 3.1.0's rustdoc announced that change for 3.2.0. 3.2.0 shipped WITHOUT it and says so in its
# own changelog — the defaults work is now tracked for 3.3.0 — and that was VERIFIED here
# before bumping, not taken on trust: `backoff.rs`'s constants and `impl Default for
# RetryConfig` are byte-identical between 3.1.0 and 3.2.0. So the guard still points at the
# next release, not this one.
magi-core = { version = "=3.2.0", features = ["ollama", "openai-compat", "claude-api"] }
instant-distance = { version = "0.6", optional = true }

# Vault MS2 — REQ-V42 layer 1: mlock/VirtualLock via a safe crate (no own unsafe).
region = "3.0.2"
# Vault MS2 — REQ-V18: passphrase strength (built-in dictionaries, no network).
zxcvbn = "3.1.1"
# Vault MS2 — REQ-V10: hidden passphrase/value prompt (no echo) cross-platform.
rpassword = "7.5.4"
# Headless MS2 T4 — REQ-H36: `CancellationToken` for cooperative run cancellation
# (wall-clock `--timeout` fires it to drop the in-flight LLM stream and signal
# tool subprocesses to die). Pure-Rust, no own unsafe; `sync` module needs no
# feature flag. Pinned (minor), no default features.
tokio-util = { version = "0.7", default-features = false }
# PathGuard::canonicalize_robust — Windows verbatim (`\\?\C:\...`) and UNC
# (`\\?\UNC\server\share\...`) canonical forms. A hand-rolled `strip_prefix`
# only handled the local-disk verbatim shape and produced an invalid,
# non-absolute path (`UNC\server\share\...`) for the UNC shape; `dunce` is a
# tiny, dependency-free, no-`unsafe` crate purpose-built for exactly this
# distinction (see its `is_safe_to_strip_unc`, which only strips
# `Prefix::VerbatimDisk`, never `VerbatimUNC`). Already present (as a
# dev-dependency for test fixtures); promoted here for production use, no new
# transitive dependency introduced.
dunce = "1.0.5"

[dev-dependencies]
# `test-util` unlocks `tokio::time::{pause, advance}` for a virtual/paused clock.
# Task 2.3 review (m2): two `mode_classifier` tests exercised the real
# `CLASSIFY_TIMEOUT_SECS`/30s doubles with a live sleep (~30s of real wall clock
# across the two); a paused clock advances past the same timers instantly.
# Dev-only: Cargo unifies this with the pinned `tokio = "1.36"` main dependency
# for test builds, and it never reaches a release binary (dev-dependencies are
# not part of the release dependency graph).
tokio = { version = "1.36", features = ["test-util"] }
# RoutingMockProvider for consult tests. Repeats the [dependencies] features plus
# `test-utils`: without the full list the dev-dependency would resolve a different
# combination, and the version is pinned with `=` for the same reason as above (retry
# defaults, now tracked for 3.3.0). Keep this line's version in lockstep with the
# [dependencies] one: two different pins would build the tests against a different crate
# than production.
magi-core = { version = "=3.2.0", features = ["ollama", "openai-compat", "claude-api", "test-utils"] }
# Mocking for tests
mockall = "0.12"
mockito = "1.4"
tempfile = "3.10"
tokio-test = "0.4"
serial_test = "3.0"
# dunce is a regular dependency now (see [dependencies]); test fixtures still
# use it to canonicalize temp-dir roots without Windows verbatim `\\?\`
# prefixes / macOS `/tmp`→`/private/tmp` symlinks (T1 fixtures).

[features]
## Enable opt-in HNSW ANN index (CP2-A). Off by default; brute-force exact
## search is always available and is the default retrieval path (D-05).
ann = ["dep:instant-distance"]

# Vault MS2 — REQ-V42 layer 2 (POSIX only): RLIMIT_CORE=0 suppresses core dumps.
[target.'cfg(unix)'.dependencies]
rlimit = "0.11.0"
# Headless MS2 T4 — REQ-H36: kill a bash subprocess TREE on `--timeout`. The tool
# spawns the shell in its own process group (`Command::process_group(0)`) and, on
# cancel, `rustix::process::kill_process_group(pid, SIGKILL)` signals the whole
# group. Safe wrapper over `kill(2)`, honoring crate-wide `forbid(unsafe_code)`;
# `process` feature only. On Linux this unions with the `fs` feature declared in
# the linux-only block below. Pinned.
rustix = { version = "0.38", features = ["process"] }

# Vault MS2 — REQ-V42 layer 2 (Linux only): PR_SET_DUMPABLE=0 (also blocks peer ptrace).
[target.'cfg(target_os = "linux")'.dependencies]
prctl = "1.0.0"
# Headless MS1 T2 — REQ-H01/H41: atomic no-replace rename for the `.magi/` scaffold.
# `renameat_with(RenameFlags::NOREPLACE)` → `renameat2(RENAME_NOREPLACE)`, a
# portable safe wrapper (no own `unsafe`, honoring crate-wide `forbid(unsafe_code)`).
# Linux-only: rustix gates `renameat_with` behind `cfg(linux_kernel)`; macOS/other
# unix fall back to the portable `create_dir` mkdir-gate (also atomic no-replace).
# Pinned; `fs` feature only.
rustix = { version = "0.38", features = ["fs"] }

# Headless MS1 T2 — REQ-H38: restrict `.magi/` ACL to the current user on Windows
# (the POSIX 0700/0600 equivalent). `windows-acl` encapsulates the Win32 `unsafe`
# inside a safe crate, so magi-rs keeps `forbid(unsafe_code)`; NO raw Win32.
# Pinned; Windows-only target.
[target.'cfg(windows)'.dependencies]
# Headless MS2 T4 — REQ-H36: kill a bash subprocess TREE on `--timeout`. The tool
# assigns the spawned shell to a Win32 Job Object created with
# `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE`; dropping the job handle terminates the
# whole tree (grandchildren included), the dual of the POSIX process-group kill.
# `win32job` encapsulates the Win32 `unsafe` in a safe crate, so magi-rs keeps
# `forbid(unsafe_code)`; NO raw Win32, NO `windows`-crate calls of our own. Pinned.
win32job = "2.0.3"
windows-acl = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
