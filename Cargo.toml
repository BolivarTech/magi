[package]
name = "magi-rs"
version = "0.6.0"
edition = "2021"
authors = ["Julian Bolivar <jbolivarg@gmail.com>"]
description = "Magi Agent: a terminal AI assistant in Rust with sandboxed tool execution, OAuth login, and encrypted local memory (Argon2 + AES-256-GCM-SIV + Reed-Solomon FEC)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/BolivarTech/magi"
readme = "README.md"
keywords = ["terminal", "ai", "assistant", "tui", "llm"]
categories = ["command-line-utilities"]
exclude = ["docs/AUDIT_*.md", "key.txt*", ".claude/", ".remember/", "target/"]

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# TUI
ratatui = "0.26"
crossterm = { version = "0.27", features = ["events"] }
unicode-width = "0.1"

# Networking
reqwest = { version = "0.11", features = ["json", "stream"] }
futures = "0.3"
arboard = "3.3"
keyring = "2.3"
axum = "0.7"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2.1"
aes-gcm-siv = "0.11"
argon2 = "0.5"
reed-solomon = "0.2"
zeroize = "1.8"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4"] }

# MAGI ecosystem
magi-core = "1.1"
instant-distance = { version = "0.6", optional = true }

[dev-dependencies]
# RoutingMockProvider for consult tests (no extra runtime deps; reqwest NOT pulled)
magi-core = { version = "1.1", features = ["test-utils"] }
# Mocking for tests
mockall = "0.12"
mockito = "1.4"
tempfile = "3.10"
tokio-test = "0.4"
serial_test = "3.0"

[features]
## Enable opt-in HNSW ANN index (CP2-A). Off by default; brute-force exact
## search is always available and is the default retrieval path (D-05).
ann = ["dep:instant-distance"]
