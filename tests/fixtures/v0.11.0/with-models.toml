# Generated by magi-rs --init-config / /init-config — built-in Ollama-first defaults.
# Edit to customize, or set provider = "anthropic" to use Anthropic instead.
provider = "openai"

[openai]
base_url = "http://localhost:11434/v1"
model    = "kimi-k2.6:cloud"

[anthropic]
model = "claude-sonnet-4-6"

[magi]
melchior_model  = "llama3.3:70b"
balthasar_model = "mixtral:8x22b"
caspar_model    = "qwen2.5-coder:32b"
auto_approve    = false # true = launch MAGI consult automatically (announces in TUI); false = ask before each autonomous launch (default). The explicit /consult TUI command is always user-initiated and never gated.

# ---------------------------------------------------------------------------
# [memory] — tiered memory subsystem (absent = built-in defaults apply).
# Default mode is "selective" (embedding-indexed, bounded context).
# Set mode = "load_all" to reproduce v0.6.0 behavior (benchmark control).
[memory]
mode = "selective"                  # selective | load_all  (load_all = v0.6.0 control)
context_budget_tokens = 8000        # assembled-context token budget
distill_enabled = true              # false = zero LLM egress for distillation
# Retention: -1 = archive forever (never hard-delete), 0 = hard-delete on eviction,
# N>0 = hard-delete N days after eviction. For truly unlimited storage set BOTH
# evicted_retention_days = -1 AND max_records = 0 (max_records still prunes the
# weakest active records when the count exceeds the cap, even at -1).
evicted_retention_days = -1         # -1 archive forever | 0 hard-delete now | N>0 delete after N days
max_records = 50000                 # hard ceiling on active records; 0 = unlimited (opt-out the cap)
# --- Advanced [memory] knobs (default values shown; uncomment to override) ---
# response_headroom_tokens = 1024    # tokens reserved for the model reply
# safety_margin_ratio = 0.1           # fraction of budget held back (heuristic guard)
# chars_per_token = 3.5               # token heuristic; es ~3.5, code ~3.0, CJK ~2.0
# oversized_turn_policy = "truncate"  # truncate | error
# top_k = 12                          # retrieval candidate count
# weight_similarity = 1.0              # reranker weight on cosine similarity
# weight_recency = 0.3                 # reranker weight on recency
# weight_salience = 0.5              # reranker weight on salience
# default_salience = 0.3               # base salience assigned at write
# preference_salience = 1.0            # protected floor for kind=preference
# protect_salience_threshold = 0.9    # salience at/above which a memory is never evicted
# decay_half_life_days = 30.0         # wall-clock recency half-life
# access_saturation_cap = 50         # cap on access-reinforcement contribution
# forget_strength_threshold = 0.1     # strength below which a memory is forgettable
# supersede_similarity_threshold = 0.85  # same-subject hard-supersession similarity gate
# distill_every_n_turns = 20        # 0 = on-demand/session-close only
# distill_on_session_close = true     # run distiller on session close
# profile_max_tokens = 1024            # always-injected preference profile token bound
# seed = 42                         # determinism for retrieval/decay/benchmark
# salience_markers = ["prefer", "preference", "always", "never", "remember"]        # substrings that lift salience at write
# index = "exact"                    # exact (default, deterministic) | ann (build feature)
# distill_max_batch_tokens = 4000     # per-run LLM payload cap (privacy)
# supersede_max_candidate_pairs = 50  # distiller hard-supersession pair cap per run
# reembed_batch_size = 32            # lazy re-embed throttle per pass
# max_evictions_per_pass = 1000       # clock-jump guard on evictions per pass
# migration_throttle_batch = 256      # lazy migration batch size

# ---------------------------------------------------------------------------
# [embedding] — embedding provider (OpenAI-compatible, Ollama-first).
# Set model to your installed embedding model.
# Run: ollama pull nomic-embed-text-v2-moe:latest
# The embedding API key is read from OPENAI_API_KEY env only (never in this file).
[embedding]
base_url = "http://localhost:11434/v1"   # Ollama default; point elsewhere for cloud
model    = "nomic-embed-text-v2-moe:latest"  # CHANGE to your installed embedding model — run: ollama pull <model>
dim      = 0              # 0 = autodetect the vector size from the first response
# --- Advanced [embedding] knobs ---
# provider = "openai"             # embedding provider kind (openai-compatible)
# query_prefix = "search_query: "          # prefix applied to query text before embedding
# document_prefix = "search_document: "       # prefix applied to stored text before embedding
